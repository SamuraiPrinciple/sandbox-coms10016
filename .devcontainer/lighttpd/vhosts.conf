# Virtual hosts: NAME.coms10016.local -> a service in the container.
# OrbStack routes *.coms10016.local to port 80 here and adds HTTPS itself.
server.modules += ("mod_proxy")
proxy.header = ("upgrade" => "enable")

# vnc.coms10016.local: the desktop's noVNC client
$HTTP["host"] =~ "^vnc\." {
    proxy.server = ("" => (("host" => "127.0.0.1", "port" => 6080)))
    # keep an idle desktop connected for 12 hours (lighttpd's default is 60s)
    server.max-read-idle = 43200
}

# welcome.coms10016.local: a static page with a link to the desktop
$HTTP["host"] =~ "^welcome\." {
    server.document-root = "/var/www/welcome"
}
